# Passport for numeric claim provenance.
# One entry per numeric claim in the manuscript prose (phy-variation-draft.tex, then
# phy-variation-appendix.tex). Audited by /review-numbers; never re-runs scripts.
#
# COVERAGE: the audit only checks the claims listed here, so a paper number with no
# entry is invisible to it. Enter every result/data number the paper reports.
#
# Status values: PASS | FAIL | STALE | UNVERIFIED | EXPLAINED
#   PASS       - claim matches artifact within tolerance
#   FAIL       - claim differs from artifact, or artifact/key missing
#   STALE      - script modified after the artifact was written
#   UNVERIFIED - never audited (default for a newly added claim)
#   EXPLAINED  - intentional divergence or an externally sourced / console-only number;
#                requires an `explanation` string.
#
# PROJECT NOTES (read before auditing):
#   1. No \newcommand macros exist. Every number is hardcoded in the .tex prose, so
#      table-backed claims are audited against the hand-built bare-tabular .tex (or CSV)
#      the analysis script writes. artifact_key gives the row label and column.
#   2. train_cath_lab (and its AHA cousins) is NOT materialized to data/output/. Each
#      consuming script rebuilds it inline from data/input/aha_hospital.csv with the same
#      recipe (HRR-year mean(CCLABHOS=="1"), matriculation = grad_year-3 clamped [1980,2003]).
#   3. Numbers that were previously console-only now have on-disk artifacts (added
#      2026-09-25/26): the persistence median and within-physician trend (persistence.csv),
#      the pooled destination response beta_dest (event-study-pooled.csv), the
#      within-residency-hospital and placement-selection specs (training-pipeline-robust.csv,
#      training-pipeline-selection.csv), the destination-sorting diagnostic and the national
#      HRR-mean cath share (destination-sorting.csv, national-cath-share.csv), the training
#      binscatter slope (binscatter-slope.csv) and the raw recent-grad subsample counts
#      (recent-grad-sample.csv), the Top-25 panel N (rank-x-cath-panel-n.csv), the crosswalk
#      resolution counts (data/crosswalks/med-school-hrr-match-counts.csv) and the appendix A.3
#      exclusion counts (unmapped-school-composition.csv). Table 1, the balance table and the training binscatter
#      describe the analytical sample (1_descriptive.R restricted 2026-09-26). The
#      only number without an artifact is the MDE (s3-mde), a hand calculation. The pooled
#      beta_dest is still hardcoded as a literal in 7_dynamic.R (a separate flag).
#   4. permutation-summary.csv lives at results/ (NOT results/tables/).
#   5. dynamic-path.csv / place-variance-path.csv are a calibration whose two input betas
#      (0.058, 0.350) are hardcoded in 7_dynamic.R, not read from upstream files.

